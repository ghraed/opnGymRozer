name: opengym

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-opengym}
      MYSQL_USER: ${DB_USER:-opengym}
      MYSQL_PASSWORD: ${DB_PASSWORD:-opengym}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-root}
      TZ: UTC
    ports:
      - "${DB_PORT_EXPOSE:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    build: ./api
    command: npm run db:migrate
    restart: "no"
    environment: &db-environment
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-opengym}
      DB_USER: ${DB_USER:-opengym}
      DB_PASSWORD: ${DB_PASSWORD:-opengym}
    depends_on:
      mysql:
        condition: service_healthy

  import-json:
    profiles: ["tools"]
    build: ./api
    command: npm run db:import-json -- --data-dir=/import-data
    restart: "no"
    environment: *db-environment
    volumes:
      - ./data:/import-data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  seed-trainer:
    profiles: ["tools"]
    build: ./api
    command: npm run db:seed-trainer
    restart: "no"
    environment: *db-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Explicit development/demo data only. The script refuses to run unless
  # SEED_SAMPLE_USERS=1 is supplied to the compose command.
  seed-sample-users:
    profiles: ["tools"]
    build: ./api
    command: npm run db:seed-sample-users
    environment:
      <<: *db-environment
      SEED_SAMPLE_USERS: ${SEED_SAMPLE_USERS:-}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  seed-reset-sample-users:
    profiles: ["tools"]
    build: ./api
    command: npm run db:reset-sample-users
    environment:
      <<: *db-environment
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  # One-time: download the exercise images + GIFs into ./media (skipped if already there).
  # ~140 MB, from github.com/hasaneyldrm/exercises-dataset (CC).
  media:
    image: alpine/git
    volumes:
      - ./media/img:/out/img
      - ./media/gif:/out/gif
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$(ls -A /out/img 2>/dev/null)" ]; then
          echo "↓ Downloading exercise media (~140 MB, one time)…"
          git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
          cp /tmp/ds/images/*.jpg /out/img/ && cp /tmp/ds/videos/*.gif /out/gif/
          echo "✓ Exercise media ready ($$(ls /out/img | wc -l) images)."
        else
          echo "✓ Exercise media already present — skipping download."
        fi
    restart: "no"

  # Passkey auth + per-user data (Node, no framework), built from source.
  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3000            # internal port (nginx proxies here) — do not change
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-opengym}
      - DB_USER=${DB_USER:-opengym}
      - DB_PASSWORD=${DB_PASSWORD:-opengym}
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Builds the React frontend (multi-stage) and serves it, proxying /api → api
  # and the exercise media from the shared volume. Single origin for passkeys.
  web:
    image: ghcr.io/duartesantos8/opengym-web:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      media:
        condition: service_completed_successfully
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./media/img:/usr/share/nginx/html/img:ro
      - ./media/gif:/usr/share/nginx/html/gif:ro

volumes:
  mysql_data:
